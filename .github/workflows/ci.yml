name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore Fetchy.sln

      - name: Build solution
        run: dotnet build Fetchy.sln -c Release --no-restore

      - name: Run tests
        run: dotnet test Fetchy.sln -c Release --no-build --verbosity normal
